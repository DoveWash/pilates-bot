name: Pilates Bot
version: "2.4.0"
slug: pilates_bot
description: Books regular pilates/yoga classes the moment they open, for you and your friends
url: https://github.com/DoveWash/pilates-bot
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:yoga
panel_title: Pilates Bot
homeassistant_api: true
ports:
  8100/tcp: null
ports_description:
  8100/tcp: Friends' portal (point a Cloudflare Tunnel or reverse proxy here)
options:
  timezone: Australia/Sydney
  days_ahead: 7
  run_at: "00:00:00"
  prelogin_seconds: 90
  retry_minutes: "0.5,2,5,15,60"
  max_tries: 6
  discord_webhook_url: ""
  ha_notify_service: ""
  notify_when_nothing_to_book: false
  catchup_hours: 6
  portal_enabled: false
  portal_url: ""
  ntfy_server: https://ntfy.sh
schema:
  timezone: str
  days_ahead: int(0,30)
  run_at: match(^\d{2}:\d{2}(:\d{2})?$)
  prelogin_seconds: int(10,600)
  retry_minutes: str
  max_tries: int(1,50)
  discord_webhook_url: password?
  ha_notify_service: str?
  notify_when_nothing_to_book: bool
  catchup_hours: int(0,24)
  portal_enabled: bool
  portal_url: str?
  ntfy_server: str
